  .cs-header-left>.cs-icon-button { display:none; }
  .cs-header-left>svg { width:28px; }
  .cs-header-search { display:none; }
  .cs-header-actions { gap:8px; }
  .cs-header-actions>.cs-icon-button { display:none; }
  .cs-segmented { height:34px; }
  .cs-segmented button { padding:4px 12px; font-size:12px; }
  .cs-sidebar { top:0; padding-top:20px; visibility:hidden; transform:translateX(-100%); transition:transform var(--cs-motion-normal); box-shadow:var(--cs-shadow-overlay); }
  .cs-sidebar.is-open { visibility:visible; transform:translateX(0); }
  .cs-mobile-close { display:flex; justify-content:flex-end; margin-bottom:8px; }
  .cs-backdrop { display:block; position:fixed; inset:0; z-index:55; background:var(--cs-color-overlay); border:0; }
  .cs-main { margin-left:0; padding:78px 16px 40px; }
  .cs-notice { align-items:flex-start; min-height:58px; }
  .cs-notice>svg { margin-top:4px; }
  .cs-notice-content strong { display:block; margin-right:0; }
  .cs-notice-actions { display:none; }
  .cs-file-table { min-width:660px; }
  .cs-file-table input[type=checkbox] { opacity:1; }
  .cs-ui :is(.cs-icon-button,.cs-search-clear) { min-width:36px; min-height:36px; }
  .cs-ui .cs-menu button { min-height:44px; }

@media (prefers-reduced-motion:reduce) { .cs-ui *, .cs-ui *:before, .cs-ui *:after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }
@media (forced-colors:active) { .cs-ui .cs-button--primary, .cs-ui .cs-filter-chips button[aria-pressed=true] { border:2px solid ButtonText; } .cs-file-letter { border:1px solid CanvasText; } .cs-sidebar-link.is-active:before { border-color:Highlight; } }

.cs-theme-switcher { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
.cs-theme-switcher>span { font-weight:600; }

.cs-ui .demo-intro { margin-top:38px; }
.cs-ui .demo-intro h1 { font-size:24px; font-weight:600; line-height:32px; margin:0 0 12px 8px; }
.demo-quick-cards { display:flex; flex-wrap:wrap; gap:8px; }
.demo-recent { margin-top:28px; }
.demo-recent--standalone { margin-top:40px; }
.demo-recent h2 { font-size:16px; line-height:22px; font-weight:600; margin:0 0 18px 8px; }
.demo-toolbar { display:flex; align-items:center; gap:16px; margin-bottom:12px; min-height:36px; }
.demo-filter-search { margin-left:auto; width:240px; height:36px; background:transparent; }
.demo-filter-search>svg { display:none; }
.demo-filter-search input { font-size:14px; }
.demo-selection { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--cs-color-brand-foreground); }
.demo-selection .cs-button { font-size:12px; padding:4px; }
.demo-toast { position:fixed; bottom:24px; right:24px; max-width:380px; padding:14px 20px; background:var(--cs-color-surface); border:1px solid var(--cs-color-border); border-radius:8px; box-shadow:var(--cs-shadow-overlay); display:flex; gap:12px; align-items:center; z-index:120; }
.demo-toast svg { color:var(--cs-color-success); }
.demo-dialog { width:min(520px,calc(100vw - 32px)); max-height:80vh; overflow:auto; border:1px solid var(--cs-color-border); border-radius:12px; padding:24px; box-shadow:var(--cs-shadow-overlay); background:var(--cs-color-surface); }
.demo-dialog::backdrop { background:var(--cs-color-overlay); }
.demo-dialog-heading { display:flex; align-items:flex-start; gap:16px; justify-content:space-between; }
.demo-dialog-heading h2 { margin:4px 0 20px; font-size:20px; line-height:26px; overflow-wrap:anywhere; }
.demo-dialog p { color:var(--cs-color-text-secondary); line-height:22px; margin:0 0 16px; }
.demo-dialog-footer { display:flex; justify-content:flex-end; margin-top:24px; }
.demo-file-details { display:flex; align-items:flex-start; gap:20px; }

.demo-file-details dt { color:var(--cs-color-text-secondary); font-size:12px; }
.demo-file-details dd { margin:0 0 12px; }
.demo-catalog { max-width:1240px; margin:0 auto; }
.demo-catalog section { scroll-margin-top:84px; }
.demo-catalog-identity { padding:12px 12px 28px; }

.demo-catalog-identity small { display:block; color:var(--cs-color-text-secondary); font-size:12px; margin-top:4px; }
.demo-eyebrow { font-size:11px; line-height:16px; letter-spacing:1.4px; font-weight:600; color:var(--cs-color-brand-foreground); }
.demo-source-note { padding:16px 12px; color:var(--cs-color-text-secondary); font-size:12px; }
.demo-source-note p { margin:8px 0 12px; line-height:18px; }
.demo-source-note small { color:var(--cs-color-text); font-size:11px; }
.demo-catalog-hero { padding:32px 32px 0; border:1px solid var(--cs-color-border-subtle); border-radius:12px; background:var(--cs-color-surface); }
.demo-hero-top { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.demo-version { display:inline-flex; padding:3px 10px; background:var(--cs-color-surface-hover); color:var(--cs-color-text-secondary); border-radius:999px; font-size:11px; }
.demo-catalog-hero h1 { font-size:44px; line-height:50px; letter-spacing:-1.2px; font-weight:600; margin:28px 0 16px; }
.demo-catalog-hero p { font-size:16px; line-height:24px; color:var(--cs-color-text-secondary); margin:0 0 24px; }
.demo-hero-actions { display:flex; align-items:center; flex-wrap:wrap; gap:12px; }
.demo-hero-actions .cs-button { min-height:38px; }

.demo-system-facts>span { color:var(--cs-color-text-secondary); font-size:12px; }
.demo-system-facts strong { display:block; color:var(--cs-color-text); font-size:22px; font-weight:600; line-height:28px; margin-bottom:2px; }
.demo-catalog-section { margin-top:48px; }
.demo-section-heading { display:flex; gap:14px; margin-bottom:24px; }
.demo-section-heading>span { font-size:11px; color:var(--cs-color-brand-foreground); width:24px; margin-top:7px; font-weight:600; }
.demo-section-heading h2 { font-size:24px; line-height:32px; font-weight:600; margin:0; letter-spacing:-.3px; }
.demo-section-heading p { color:var(--cs-color-text-secondary); margin:6px 0 0; }
.demo-palette { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); border:1px solid var(--cs-color-border-subtle); border-radius:12px; overflow:hidden; background:var(--cs-color-surface); }

.demo-swatch-label { display:block; padding:12px; font-size:12px; white-space:nowrap; }

.demo-caption { font-size:12px; line-height:18px; color:var(--cs-color-text-secondary); margin:12px 0 0; }
